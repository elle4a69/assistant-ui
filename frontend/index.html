<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tori Ops" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/tori_avatar.jpg" />
    <title>Tori Operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__toriInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        window.__toriInstallPrompt = event;
        window.dispatchEvent(new Event('tori-install-available'));
      });
      window.addEventListener('appinstalled', () => {
        window.__toriInstallPrompt = null;
        window.dispatchEvent(new Event('tori-app-installed'));
      });
      if ('serviceWorker' in navigator) window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then(registration => registration.update())
          .catch(error => console.warn('Service worker registration failed:', error));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
