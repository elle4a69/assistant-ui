app = "assistant-ui-hub"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_APP_URL = "https://assistant-ui-hub.fly.dev"
  OPS_AGENT_CODE_MODE = "github"
  OPS_AGENT_ALLOW_DEPLOY = "true"
  OPS_AGENT_GITHUB_REPO = "elle4a69/assistant-ui"

[mounts]
  source = "assistant_data_clone_260830"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "3s"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
