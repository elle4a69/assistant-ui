name: Temporary OpenAI quota message repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-fix-openai-quota-message.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: temporary-openai-quota-message-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch quota handling and regression coverage
        env:
          LATER_QUOTA_TEST_B64: 
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          main_path = Path('backend/main.py')
          data = main_path.read_bytes()
          old = b'if step_number == 1 and is_openai_quota_exhausted(exc):'
          new = b'if is_openai_quota_exhausted(exc):'
          count = data.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one first-step quota guard, found {count}')
          main_path.write_bytes(data.replace(old, new, 1))

          test_path = Path('backend/test_agent_console.py')
          test_data = test_path.read_bytes()
          test_name = b'test_later_step_insufficient_quota_has_clear_safe_diagnosis'
          if test_name not in test_data:
              addition = base64.b64decode(os.environ['LATER_QUOTA_TEST_B64'])
              newline = b'\r\n' if b'\r\n' in test_data else b'\n'
              addition = addition.replace(b'\n', newline)
              if not test_data.endswith(newline):
                  test_data += newline
              test_path.write_bytes(test_data + addition)
          PY

      - name: Install backend test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Run quota regression tests
        shell: bash
        run: |
          python -m pytest \
            backend/test_agent_console.py::test_step_zero_insufficient_quota_has_clear_safe_diagnosis \
            backend/test_agent_console.py::test_later_step_insufficient_quota_has_clear_safe_diagnosis \
            -q

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-fix-openai-quota-message.yml
          git config user.name "operations-ai"
          git config user.email "operations-ai@users.noreply.github.com"
          git add backend/main.py backend/test_agent_console.py .github/workflows/temporary-fix-openai-quota-message.yml
          git commit -m "fix: report OpenAI credit exhaustion clearly"
          git push origin HEAD:main

      - name: Dispatch production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run fly.yml --ref main
