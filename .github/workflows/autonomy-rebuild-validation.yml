name: Autonomy Rebuild Validation
on:
  push:
    branches:
      - ops/autonomy-rebuild-20260918
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
          npm ci --prefix frontend
      - name: Backend tests
        run: python -m pytest backend -q
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Diff check
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git diff --check refs/remotes/origin/main..HEAD
