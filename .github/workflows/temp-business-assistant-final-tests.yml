name: Final Business Assistant verification

on:
  push:
    branches:
      - test/business-assistant-final-verification-20260918

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
          npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Run affected backend tests
        run: python -m pytest backend/test_business_assistant.py backend/test_operations_ai_chat.py backend/test_knowledge_curator.py -q
      - name: Run full backend suite
        run: python -m pytest backend -q
