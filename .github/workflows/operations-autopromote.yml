name: Operations Autonomous Promotion
run-name: Operations autonomous promotion

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: operations-autonomous-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify, promote and deploy newest autonomous coding result
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTONOMY_ACTIVATED_AT: "2026-09-15T01:50:00Z"
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Find one eligible autonomous review branch
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin '+refs/heads/ops/task-*:refs/remotes/origin/ops/task-*'
          current_main=$(git rev-parse HEAD)
          selected_ref=""
          selected_sha=""
          selected_time=""

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            sha=$(git rev-parse "$ref")
            parent_count=$(git cat-file -p "$sha" | grep -c '^parent ' || true)
            [ "$parent_count" = "1" ] || continue
            parent=$(git rev-parse "$sha^")
            [ "$parent" = "$current_main" ] || continue

            committer_email=$(git show -s --format='%ce' "$sha")
            [ "$committer_email" = "operations-ai@users.noreply.github.com" ] || continue
            committed_at=$(git show -s --format='%cI' "$sha")
            if ! python3 - "$committed_at" "$AUTONOMY_ACTIVATED_AT" <<'PY'
          import datetime as dt
          import sys
          commit = dt.datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          gate = dt.datetime.fromisoformat(sys.argv[2].replace('Z', '+00:00'))
          raise SystemExit(0 if commit >= gate else 1)
          PY
            then
              continue
            fi

            if [ -z "$selected_time" ] || [[ "$committed_at" > "$selected_time" ]]; then
              selected_ref="$ref"
              selected_sha="$sha"
              selected_time="$committed_at"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/ops/task-)

          if [ -z "$selected_sha" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No eligible autonomous review branch is waiting on current main."
            exit 0
          fi

          branch=${selected_ref#refs/remotes/origin/}
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "base=$current_main" >> "$GITHUB_OUTPUT"
          echo "Selected $branch at $selected_sha"

      - name: Validate bounded changes
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          BASE_SHA: ${{ steps.candidate.outputs.base }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA..$CANDIDATE_SHA"
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          base = os.environ['BASE_SHA']
          head = os.environ['CANDIDATE_SHA']
          raw = subprocess.check_output([
              'git', '-c', 'core.quotepath=false', 'diff', '--name-only', '-z', f'{base}..{head}'
          ])
          names = [item.decode('utf-8') for item in raw.split(b'\0') if item]
          if not names or len(names) > 100:
              raise SystemExit('Autonomous promotion rejected: invalid changed-file count')
          blocked_parts = {'.git', '.ops-worktrees', '.venv', '.vscode', 'node_modules', '__pycache__'}
          blocked_names = {'.env', 'credentials.json', 'service_account.json', 'settings.json'}
          for raw_name in names:
              path = PurePosixPath(raw_name)
              parts = [part.lower() for part in path.parts]
              if path.is_absolute() or '..' in path.parts or any(part in blocked_parts for part in parts):
                  raise SystemExit(f'Autonomous promotion rejected restricted path: {raw_name}')
              if raw_name.lower().startswith('.github/workflows/'):
                  raise SystemExit(f'Autonomous promotion rejected workflow change: {raw_name}')
              if path.name.lower() in blocked_names or path.suffix.lower() in {'.pem', '.key', '.p12', '.pfx'}:
                  raise SystemExit(f'Autonomous promotion rejected credential-shaped path: {raw_name}')
          PY

      - name: Install project dependencies
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
          npm ci --prefix frontend

      - name: Independently verify candidate
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$CANDIDATE_SHA"
          python -m pytest backend -q
          npm run build --prefix frontend

      - name: Fast-forward current main
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          BASE_SHA: ${{ steps.candidate.outputs.base }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^")" = "$BASE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"

      - name: Dispatch Fly deployment
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/fly.yml/dispatches" \
            --data '{"ref":"main"}'

      - name: Record autonomous promotion status
        if: steps.candidate.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg target_url "$RUN_URL" \
            '{state:"success",context:"operations-autonomous-promotion",description:"Autonomous verification passed; promoted and deployment dispatched",target_url:$target_url}' \
          | curl --fail --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
              --data-binary @-
