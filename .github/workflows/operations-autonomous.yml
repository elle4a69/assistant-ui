name: Operations Autonomous Promotion
run-name: Operations autonomous promotion

on:
  push:
    branches:
      - 'ops/task-*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: operations-autonomous-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify, promote and verify production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate autonomous branch identity
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          python3 - <<'PY'
          import os, re
          branch = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"ops/task-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}", branch, re.I):
              raise SystemExit("Not an Operations task branch")
          PY

      - name: Check out exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require Operations worker authorship and current-main parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          current_main=$(git rev-parse refs/remotes/origin/main)
          parent_count=$(git cat-file -p "$GITHUB_SHA" | grep -c '^parent ')
          parent_commit=$(git rev-parse "$GITHUB_SHA^")
          author_email=$(git show -s --format='%ae' "$GITHUB_SHA")
          committer_email=$(git show -s --format='%ce' "$GITHUB_SHA")
          test "$parent_count" = "1"
          test "$parent_commit" = "$current_main"
          test "$author_email" = "operations-ai@users.noreply.github.com"
          test "$committer_email" = "operations-ai@users.noreply.github.com"
          echo "OPERATIONS_BASE=$current_main" >> "$GITHUB_ENV"

      - name: Validate bounded safe change set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import PurePosixPath

          base = os.environ["OPERATIONS_BASE"]
          head = os.environ["GITHUB_SHA"]
          raw = subprocess.check_output(["git", "-c", "core.quotepath=false", "diff", "--name-only", "-z", f"{base}..{head}"])
          names = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          if not names:
              raise SystemExit("Autonomous promotion requires an actual code change")
          if len(names) > 100:
              raise SystemExit("Autonomous promotion rejected: too many changed files")

          blocked_parts = {".codex-secrets", ".git", ".ops-worktrees", ".venv", ".vscode", "__pycache__", "node_modules"}
          blocked_names = {".env", "credentials.json", "service_account.json", "settings.json"}
          protected_roots = {
              ".github/workflows",
              "infra",
              "terraform",
          }

          for raw_name in names:
              path = PurePosixPath(raw_name)
              lower = raw_name.lower()
              parts = [part.lower() for part in path.parts]
              if path.is_absolute() or ".." in path.parts or any(part in blocked_parts for part in parts):
                  raise SystemExit(f"Restricted autonomous path: {raw_name}")
              if any(lower == root or lower.startswith(root + "/") for root in protected_roots):
                  raise SystemExit(f"Protected change requires owner-controlled workflow: {raw_name}")
              if path.name.lower() in blocked_names or path.suffix.lower() in {".pem", ".key", ".p12", ".pfx"}:
                  raise SystemExit(f"Credential-shaped path rejected: {raw_name}")

          diff = subprocess.check_output(["git", "diff", "--unified=0", "--no-ext-diff", f"{base}..{head}"])
          if len(diff) > 2_000_000:
              raise SystemExit("Autonomous promotion rejected: diff too large")
          added = "\n".join(
              line[1:] for line in diff.decode("utf-8", errors="replace").splitlines()
              if line.startswith("+") and not line.startswith("+++")
          )
          secret_patterns = (
              r"github_pat_[A-Za-z0-9_]{20,}",
              r"gh[pousr]_[A-Za-z0-9]{20,}",
              r"sk-[A-Za-z0-9_-]{20,}",
              r"FlyV1\s+[A-Za-z0-9+/=,_-]{20,}",
              r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              r"(?i)(?:password|api[_-]?key|bearer[_-]?token|access[_-]?token|secret)\s*[:=]\s*[\"']?[A-Za-z0-9+/=_-]{20,}",
          )
          if any(re.search(pattern, added) for pattern in secret_patterns):
              raise SystemExit("Autonomous promotion rejected: secret-shaped value detected")
          PY
          git diff --check "$OPERATIONS_BASE..$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
          npm ci --prefix frontend

      - name: Independently verify backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest backend -q
          npm run build --prefix frontend
          git diff --check "$OPERATIONS_BASE..$GITHUB_SHA"

      - name: Fast-forward exact reviewed commit to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$OPERATIONS_BASE"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$OPERATIONS_BASE"
          git push origin "$GITHUB_SHA:refs/heads/main"

      - name: Wait for exact Fly deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 90); do
            run_id=$(gh run list --workflow fly.yml --commit "$GITHUB_SHA" --limit 10 --json databaseId,headSha,status,conclusion               --jq '[.[] | select(.headSha == env.GITHUB_SHA)][0].databaseId // ""')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify production health
        shell: bash
        run: |
          curl --fail --silent --show-error             --retry 12 --retry-delay 5 --retry-all-errors             https://assistant-ui-hub.fly.dev/api/health

      - name: Remove promoted review branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin --delete "$GITHUB_REF_NAME"

      - name: Report autonomous promotion result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          description="Autonomous verification, promotion and production health passed"
          if [ "$JOB_STATUS" != "success" ]; then
            state=failure
            description="Autonomous promotion stopped before verified production"
          fi
          jq -n             --arg state "$state"             --arg description "$description"             --arg target_url "$RUN_URL"             '{state: $state, context: "operations-autonomous-promotion", description: $description, target_url: $target_url}'           | curl --fail --silent --show-error               --request POST               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer $GH_TOKEN"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"               --data-binary @-
