name: Temporary backend verification

on:
  push:
    branches:
      - test/business-assistant-backend-20260918

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest
      - name: Run focused Business Assistant tests
        run: python -m pytest backend/test_business_assistant.py backend/test_operations_ai_chat.py -q
      - name: Run full backend suite
        run: python -m pytest backend -q
